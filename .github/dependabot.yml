version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot updates the pin + comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Flag newly-disclosed CVEs / updates in the Python dependency closure.
  #
  # `/requirements` IS DELIBERATELY NOT LISTED, and adding it back will break CI.
  #
  # It was listed from v0.30.8 until 2026-08-28, when the first run proved Dependabot cannot
  # maintain a fully-pinned transitive lock: PR #225 bumped `pydantic-core` 2.46.4 -> 2.48.0 in
  # requirements/dev.txt and left `pydantic==2.13.4`, which pins `pydantic-core==2.46.4`. Every
  # job failed with ResolutionImpossible. Dependabot edits individual pinned lines; a lock has
  # to be RE-RESOLVED as a graph.
  #
  # `.github/workflows/relock.yml` took that job over. Dependabot keeps watching pyproject.toml,
  # which is what it is actually good at - advisories against declared ranges.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
