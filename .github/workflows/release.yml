name: release

# Publishes to PyPI when a GitHub Release is published, via PyPI Trusted Publishing
# (OIDC, no stored token) with PEP 740 attestations. Runs through a protected `pypi`
# environment (human approval). One-time setup + per-release steps: RELEASING.md.
# Actions are pinned to commit SHAs (Dependabot keeps them current).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi          # protected environment — gates the publish behind approval
    permissions:
      id-token: write          # required for Trusted Publishing (OIDC) + attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Security gate (pip-audit + bandit, runtime closure)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit bandit
          pip-audit --skip-editable
          bandit -r src
      - name: Unit suite (never publish a red tag)
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build sdist + wheel
        run: |
          pip install build==1.5.0 twine==6.2.0
          python -m build
      - name: Check metadata + guard dist contents
        run: |
          twine check dist/*
          # fail loudly if a probe transcript / secret / research or experiments file
          # ever sneaks into the sdist.
          #
          # `.py` files are excluded from the word match, and only from the word match. The
          # pattern is a SUBSTRING test on paths, so a legitimately-named source file trips it:
          # tests/test_read_only_means_a_read_only_token.py blocked the v0.30.2 security release
          # for containing the word "token". The guard failed closed, which is right, but a
          # false positive that only appears at publish time ambushes the release it is meant to
          # protect.
          #
          # What this costs: nothing this check ever provided. It matches FILENAMES, never
          # contents, so a secret hardcoded in a .py was invisible to it before and still is -
          # that is bandit's and gitleaks' job. Real credentials are .json/.txt/.pem, and every
          # one of them is still caught. Verified against token.json, credentials.json,
          # client_secret_*.json, token_full.json, a probe transcript, research/ and
          # experiments/ - all six still flagged.
          #
          # tests/test_sdist_guard.py runs this same pattern over the tracked tree, so a
          # colliding filename fails on the PR that adds it rather than during a release.
          if tar tzf dist/*.tar.gz | grep -Ev '\.py$' \
               | grep -Ei '(^|/)(research|experiments)/|token|credential|client_secret'; then
            echo "::error::unexpected file in sdist — refusing to publish"; exit 1
          fi
      - name: Publish to PyPI (Trusted Publishing + PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true
